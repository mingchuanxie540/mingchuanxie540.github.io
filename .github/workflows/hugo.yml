name: Build and Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:  # ✅ 添加：允许手动触发构建

# ✅ 添加权限配置（GitHub Pages 部署必需）
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ========== 构建任务 ==========
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # ✅ 更新到 v4（支持 Node.js 24）
        with:
          submodules: recursive            # ✅ 关键：加载主题子模块
          fetch-depth: 0                   # ✅ 获取完整历史（用于最后更新时间）

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3    # ✅ 更新到 v3（支持 Node.js 24）
        with:
          hugo-version: '0.128.0'          # ✅ 固定稳定版（避免 latest 突然变更）
          extended: true                   # ✅ 必须：支持 SCSS/图片处理

      - name: Build with verbose output
        run: hugo --minify --verbose       # ✅ 加 --verbose 便于排查错误

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # ✅ 官方上传 action
        with:
          path: ./public

  # ========== 部署任务 ==========
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build                          # ✅ 依赖 build 任务成功
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4     # ✅ 官方部署 action（v4）
