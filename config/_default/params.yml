########################################
# 🔧 基础配置（必填 + 增强）
########################################

# 🧭 主菜单导航（增强：添加常用入口）
menu:
  - name: home
    url: ""
    icon: ""                    # 留空使用默认太极图标，或填 Font Awesome 代码如 'f015'
  - name: archives
    url: "archives"
    icon: ""
  - name: categories            # ← 新增：分类入口
    url: "categories"
    icon: ""
  - name: tags                  # ← 新增：标签入口
    url: "tags"
    icon: ""
  - name: about
    url: "about"
    icon: ""
  - name: resume                # ← 新增：简历入口
    url: "resume"
    icon: ""
  - name: friend
    url: "friend"
    icon: ""

# 主内容区块（用于首页文章筛选）
mainSections: ["post"]

# 📅 时间格式（保持默认，兼容 Hugo）
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

# 👤 个人信息 ⭐ 已填你的信息
author: mingchuanxie
email: mingchuanxie540@gmail.com
description: "记录技术成长与生活点滴 | Hugo + GitHub Pages + 灵梦主题"

# ✨ 副标题（打字机效果 - 推荐开启）
subtitle:
  typing:
    enable: true                # ← ✅ 开启打字机动画
    strings:
      - "博丽神社的巫女"
      - "全栈开发工程师"
      - "热爱技术与生活"
      - "少女祈祷中..."
    typeSpeed: 100              # 打字速度（毫秒/字符）
    backSpeed: 50               # 删除速度
    backDelay: 2000             # 打完一句后等待时间
    startDelay: 300             # 页面加载后等待时间
    loop: true                  # 循环播放
    shuffle: false              # 按顺序输出
    showCursor: true            # 显示闪烁光标
    cursorChar: "|"
    smartBackspace: true        # 智能退格
  text: "mingchuanxie 的博客"   # ← 打字机禁用时显示

# 🖼️ 横幅与头像
banner: "images/banner.webp"    # 确保 static/images/ 下有该文件
banner_srcset:
  enable: false                 # 如需响应式图片再开启
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"

avatar: "avatar.webp"           # 确保 static/avatar/ 下有该文件

# 文章封面默认策略
cover: ""                       # 空=用banner，false=不显示，或填图片链接/颜色

# 目录显示（增强：文章内自动显示）
toc: true

# 🔗 Open Graph（SEO 增强）
open_graph:
  enable: true
  options:
    # 可选：添加 Twitter Card 等
    # twitter_card: summary_large_image
    # twitter_id: your_twitter_id

# 📝 内容摘要
excerpt_link: "阅读全文"

# ⚖️ 版权声明（可选：开启后文章末尾显示）
copyright:
  enable: true
  content: |-
    <div style="text-align:center;margin-top:20px;padding:15px;background:#f8f9fa;border-radius:8px;">
      <p>📄 本作品采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> 协议进行许可</p>
      <p>🔗 转载请注明出处：<a href="https://mingchuanxie540.github.io" target="_blank">mingchuanxie540.github.io</a></p>
    </div>

# 🦶 页脚配置（增强：显示统计 + 备案）
footer:
  since: 2026                   # ← 改你的建站年份
  powered: true                 # 显示 "Powered by Hugo"
  count: true                   # 显示访问统计（不蒜子）
  busuanzi: true                # 启用不蒜子统计
  icon:
    url: "../images/taichi.png"
    rotate: true                # 鼠标悬停旋转
    mask: true                  # 使用图片作为遮罩

########################################
# 📍 侧边栏配置（已在右边 ✅）
########################################

sidebar:
  position: right               # ✅ 保持 right
  menu: true                    # 显示菜单按钮（移动端）
  article:
    show_common: true           # 显示常用侧边栏（分类/标签等）

# 🔗 社交链接（已填你的信息 + 常用平台）
social:
  email: mingchuanxie540@gmail.com
  github: https://github.com/mingchuanxie540
  # bilibili: https://space.bilibili.com/你的UID      # ← 按需取消注释
  # weibo: https://weibo.com/u/你的ID                  # ← 按需取消注释
  # zhihu: https://www.zhihu.com/people/你的用户名      # ← 按需取消注释
  # twitter: https://twitter.com/yourname              # ← 按需取消注释

# 🧩 侧边栏小工具（精简核心 4 个，保证加载速度）
widgets:
  - category        # 分类
  - tag             # 标签
  - tagcloud        # 标签云
  - recent_posts    # 最新文章

# 小工具数量限制（性能优化）
category_limits: 10
tag_limits: 10
recent_posts_limits: 5
tagcloud_limits: 20

# 归档页性能优化（大量标签时只显示胶囊）
only_show_capsule_in_index: true
uppercase_capsule: true

# 显示文章更新时间（按需）
show_update_time: true          # ← ✅ 开启：显示最后更新时间

# 摘要样式
summary:
  enable: true                  # ← ✅ 开启：首页显示文章摘要
  style: 'subtitle'             # 'subtitle' 或 'blockquote'

# 📡 RSS 输出（增强：支持全文订阅）
rss:
  limit: 20                     # 输出最近 20 篇
  showFullContent: true         # ✅ 输出全文（方便订阅者阅读）
  showCopyright: true           # 末尾添加版权声明

# 🔄 排序规则（最新内容优先）
sort_order:
  taxonomy:
    category: date-reverse
    tag: date-reverse
  archive: date-reverse
  home: date-reverse            # ← ✅ 首页按发布时间倒序

# 📄 分页设置（平衡加载速度与浏览体验）
paginate:
  archive: 12                   # 归档页每页 12 篇
  post: 10                      # 首页/列表页每页 10 篇

########################################
# 🎨 视觉与布局（增强阅读体验）
########################################

layout:
  max_width: 1200px             # ← 适当减小，提升阅读舒适度

# 角标（可选：显示 GitHub 角标）
triangle_badge:
  enable: true
  icon: github
  link: https://github.com/mingchuanxie540

# 锚点图标（文章内标题旁显示链接图标）
anchor_icon: ""                 # 留空用默认 '#'

# 🎮 灵梦主题特色：自定义鼠标指针
reimu_cursor:
  enable: true
  cursor:
    default: ../images/cursor/reimu-cursor-default.png
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

# 图标字体（保持默认）
icon_font: 4552607_ex15nbittbh

# 🔤 字体配置（中文优化 + 代码字体）
font:
  enable: true
  article:
    - Noto Serif SC             # 中文衬线体（优雅易读）
    - Mulish                    # 英文无衬线体
  code:
    - JetBrains Mono            # 代码字体（推荐）

# 本地回退字体（无网络时显示）
local_font:
  article:
    - "-apple-system"
    - PingFang SC
    - Microsoft YaHei
    - sans-serif
  code:
    - Menlo
    - Monaco
    - Consolas
    - monospace

# 🌓 暗黑模式（跟随系统）
dark_mode:
  enable: auto                  # true=默认暗黑 / false=默认亮色 / auto=跟随系统

########################################
# ⚡ 性能优化（关键！关闭重型功能）
########################################

# 🔥 关闭不必要的实验性功能（提升加载速度 + 稳定性）
pjax:
  enable: false                 # ❌ 关闭：可能兼容性问题

service_worker:
  enable: false                 # ❌ 关闭：除非需要 PWA 离线功能

live2d:
  enable: false                 # ❌ 关闭：看板娘会拖慢加载

live2d_widgets:
  enable: false

quicklink:
  enable: false                 # ❌ 关闭：预加载可能增加服务器压力

# ✅ 开启实用性能优化
preloader:
  enable: true
  text:
    zh-CN: 少女祈祷中...
    zh-TW: 少女祈禱中...
    en: Loading...
  icon: ""                      # 留空用默认内联 SVG
  rotate: true

# 🎬 动画（适度开启，保持流畅）
animation:
  enable: true
  options:
    header: { title: slide-up, subTitle: slide-down }
    home: { post: fade-up, widget: fade-up, sidebar: fade-up }
    article: { whole: fade-up, date: zoom-in, category: zoom-in, tag: zoom-in, comment: zoom-in, reading: zoom-in, nav: fade-up }
    archive: { whole: fade-up, tag: zoom-in, category: zoom-in, section: fade-up, nav: fade-up }

# 🎆 烟花特效（手机端自动关闭，提升性能）
firework:
  enable: true
  disable_on_mobile: true       # ✅ 关键：手机端禁用
  options:
    excludeElements: ["a", "button"]
    particles:
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)"]
        number: 15              # ← 适当减少粒子数
        duration: [1200, 1800]
        shapeOptions: { radius: [16, 32], alpha: [0.3, 0.5] }
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions: { radius: 20, alpha: [0.2, 0.5], lineWidth: 6 }

########################################
# 💬 评论系统（推荐 Giscus，基于 GitHub）
########################################

comment:
  title:
    en: Leave a comment
    zh-CN: 说些什么吧！
    zh-TW: 說些什麼吧！
  default: giscus               # ← ✅ 推荐：无需后端，基于 GitHub

# ✅ Giscus 配置（在 https://giscus.app/zh-CN 生成）
giscus:
  enable: true
  repo: mingchuanxie540/mingchuanxie540.github.io   # ← 你的仓库
  repoId: ""                    # ← 在 giscus.app 生成
  category: General
  categoryId: ""                # ← 在 giscus.app 生成
  mapping: pathname             # 用页面路径标识评论
  strict: 0
  reactionsEnabled: 1           # 显示表情反应
  emitMetadata: 0
  inputPosition: bottom         # 输入框在底部
  theme:
    light: light
    dark: dark

# ❌ 其他评论系统保持关闭（除非你确定要用）
waline: { enable: false, serverURL: "" }
valine: { enable: false, appId: "", appKey: "" }
twikoo: { enable: false, envId: "" }
gitalk: { enable: false }
utterances: { enable: false }
beaudar: { enable: false }
disqus: { enable: false }

########################################
# 🔍 搜索功能（本地搜索 + Algolia 预留）
########################################

# ✅ 本地搜索（零配置，完全免费，推荐先用这个）
# 只需在 hugo.toml 确保输出 JSON：
# [outputs] home = ['HTML', 'RSS', 'JSON']

# ⚠️ Algolia 搜索（需要配置 + 上传索引，先保持关闭）
algolia_search:
  enable: false                 # ← 先用本地搜索，需要时再改 true
  appID: "Q7EXNAF0XS"           # ← 你的 AppID（已填）
  apiKey: "2060a7952a65d36387b78ff140cb5d80"  # ⚠️ 确认是 Search-Only Key！
  indexName: "mingchuanxie540_blog"  # ← 必填：自定义索引名
  hits: { per_page: 10 }

########################################
# 📝 文章与版权（增强保护）
########################################

# 文章末尾版权声明
article_copyright:
  enable: true                  # ✅ 开启：保护原创
  content:
    author: true
    link: true
    title: true
    date: true
    updated: true
    license: true
    license_type: by-nc-sa      # CC 协议：署名 - 非商业 - 相同方式共享

# 🔝 返回顶部按钮
top:
  enable: true
  position: right
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true

# ⏰ 文章过时提醒（技术博客推荐开启）
outdate:
  enable: true                  # ✅ 开启：提醒读者内容可能过时
  daysAgo: 180                  # 180 天前更新的文章显示提醒
  message:
    zh-CN: 本文最后更新于 {time}，请注意文中内容可能已不适用。
    zh-TW: 本文最後更新於 {time}，請注意文中內容可能已不適用。
    en: This article was last updated on {time}. Content may be outdated.

# 🇨🇳 ICP 备案（国内服务器必填）
icp:
  icpnumber: ""                 # ← 有备案就填，如 "粤ICP备12345678号"
  beian: ""
  recordcode: ""

moe_icp:
  icpnumber: ""

# ☕ 打赏功能（按需开启）
sponsor:
  enable: true
  tip:
    zh-CN: 请作者喝杯咖啡吧
    zh-TW: 請作者喝杯咖啡吧
    en: Buy me a coffee
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true
  qr:
    # - name: 支付宝
    #   src: "sponsor/alipay.jpg"
    # - name: 微信
    #   src: "sponsor/wechat.png"

# 🔗 分享按钮（按需启用）
share: true
  #- weibo
  # - weixin
  # - qq
  # - twitter

# 🏷️ 首页分类卡片（按需开启）
home_categories:
  enable: true
  content: []

########################################
# 🔧 高级注入（自定义代码/统计）
########################################

injector:
  head_begin: ""
  head_end: |                   # ← 可注入自定义 CSS/统计代码
    <link rel="stylesheet" href="/css/custom.css">
    <!-- 百度统计代码可放这里（如有） -->
    <!--
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?你的ID";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
    -->
  body_begin: ""
  body_end: ""
  sidebar_begin: ""
  sidebar_end: ""

