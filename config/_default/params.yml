# =============================================================================
# 🔧 基础信息配置（显示在侧边栏/页脚/SEO）
# =============================================================================

# 👤 作者信息
author: 明传协                                    # 作者名（显示在文章末尾/侧边栏/SEO）
email: mingchuanxie540@gmail.com                  # 联系邮箱（显示在社交链接/关于页面）
description: "记录技术成长与生活点滴 | Hugo + GitHub Pages + 灵梦主题"  # 网站描述（SEO + 社交分享预览）

# ✨ 副标题配置（支持打字机动画）
subtitle:
  typing:
    enable: true                                  # ✅ 开启打字机动画效果
    strings:                                      # 轮流显示的句子列表
      - "博丽神社的巫女"
      - "全栈开发工程师"
      - "热爱技术与生活"
      - "少女祈祷中..."
    typeSpeed: 100                                # 打字速度（毫秒/字符，越小越快）
    backSpeed: 50                                 # 删除速度（毫秒/字符）
    backDelay: 2000                               # 打完一句后等待时间（毫秒）
    startDelay: 300                               # 页面加载后等待时间（毫秒）
    loop: true                                    # ✅ 循环播放句子
    shuffle: false                                # 按顺序输出（true=随机）
    showCursor: true                              # ✅ 显示闪烁的光标
    cursorChar: "|"                               # 光标字符
    smartBackspace: true                          # ✅ 智能退格（只删除不同部分）
  text: "明传协的博客"                              # ← 打字机禁用时显示的静态副标题

# 🖼️ 横幅与头像配置
banner: "images/banner.webp"                      # 首页横幅图片（路径相对于 static/ 目录）
banner_srcset:                                    # 响应式图片配置（按需启用）
  enable: false                                   # ❌ 关闭：除非你准备了多尺寸图片
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"

avatar: "avatar.webp"                             # 头像图片（路径：static/avatar/avatar.webp）

# 文章封面默认策略
cover: ""                                         # 空=用banner / false=不显示 / "链接"=指定图片 / "rgb(255,117,117)"=纯色

# 目录显示控制
toc: true                                         # ✅ 文章内自动显示目录（基于标题层级）

# Open Graph 社交分享优化
open_graph:
  enable: true                                    # ✅ 启用 og:* meta 标签
  options: {}                                     # 可选：自定义 Twitter Card 等（主题支持时生效）

# 内容摘要设置
excerpt_link: "阅读全文"                           # 首页文章摘要的"更多"链接文字

# =============================================================================
# 🦶 页脚配置（版权/统计/备案）
# =============================================================================

footer:
  since: 2026                                     # ← 建站年份（显示 © 2026-2026，自动更新当前年）
  powered: true                                   # ✅ 显示 "Powered by Hugo"（支持开源）
  count: true                                     # ✅ 显示访问统计（不蒜子）
  busuanzi: true                                  # ✅ 启用不蒜子统计（轻量级，无需后端）
  icon:
    url: "../images/taichi.png"                   # 页脚图标路径（相对于 css/main.css）
    rotate: true                                  # ✅ 鼠标悬停时旋转动画
    mask: true                                    # ✅ 使用图片作为遮罩（跟随主题色）

# =============================================================================
# 📍 侧边栏配置（你关心的右边 ✅）
# =============================================================================

sidebar:
  position: right                                 # ✅ 侧边栏位置：left / right（你需要的右边）
  menu: true                                      # ✅ 移动端显示菜单按钮
  article:
    show_common: true                             # ✅ 文章页显示常用侧边栏（分类/标签等）

# =============================================================================
# 🔗 社交链接配置（显示在侧边栏，按需启用）
# =============================================================================

social:
  # ✅ 已启用：取消 # 并填写你的链接
  email: "mailto:mingchuanxie540@gmail.com"       # 邮箱链接（mailto: 协议）
  github: "https://github.com/mingchuanxie540"    # GitHub 主页
  
  # 🔘 可选：按需取消注释并填写
  # bilibili: "https://space.bilibili.com/你的UID"
  # weibo: "https://weibo.com/u/你的ID"
  # zhihu: "https://www.zhihu.com/people/你的用户名"
  # twitter: "https://twitter.com/yourname"
  # linkedin: "https://www.linkedin.com/in/yourname"
  # telegram: "https://t.me/yourname"
  # discord: "https://discordapp.com/users/你的ID"
  
  # ❌ 不需要的平台保持 # 注释状态即可

# =============================================================================
# 🧩 侧边栏小工具（Widgets）
# =============================================================================

widgets:
  - category        # 分类列表（显示文章分类及数量）
  - tag             # 标签列表（显示文章标签及数量）
  - tagcloud        # 标签云（字体大小表示使用频率）
  - recent_posts    # 最新文章（显示最近发布的文章）

# 小工具数量限制（性能优化 + 界面简洁）
category_limits: 10               # 分类最多显示 10 个
tag_limits: 10                    # 标签最多显示 10 个
recent_posts_limits: 5            # 最新文章最多显示 5 篇
tagcloud_limits: 20               # 标签云最多显示 20 个标签

# 归档页性能优化（大量标签时只显示胶囊）
only_show_capsule_in_index: true  # ✅ 开启：首页只显示分类/标签胶囊，点击再展开（提升加载速度）
uppercase_capsule: true           # ✅ 胶囊文字大写（视觉统一）

# 显示文章更新时间
show_update_time: true            # ✅ 开启：文章末尾显示"最后更新于"

# =============================================================================
# 📝 文章摘要与列表配置
# =============================================================================

summary:
  enable: true                    # ✅ 开启：首页/列表页显示文章摘要
  style: 'subtitle'               # 摘要样式：'subtitle'（副标题式） / 'blockquote'（引用块式）

# RSS 订阅输出配置
rss:
  limit: 20                       # 输出最近 20 篇文章（-1=全部）
  showFullContent: true           # ✅ 输出全文（方便订阅者阅读，无需跳转）
  showCopyright: true             # ✅ 末尾添加版权声明（防搬运）

# =============================================================================
# 🔄 排序与分页配置
# =============================================================================

# 排序规则（控制文章/分类/标签的显示顺序）
sort_order:
  taxonomy:
    category: date-reverse        # 分类页：按发布时间倒序（新→旧）
    tag: date-reverse             # 标签页：按发布时间倒序
  archive: date-reverse           # 归档页：按发布时间倒序
  home: date-reverse              # 首页：按发布时间倒序（最新内容优先）

# 分页设置（平衡加载速度与浏览体验）
paginate:
  archive: 12                     # 归档页/分类页/标签页：每页 12 篇文章
  post: 10                        # 首页/其他列表页：每页 10 篇文章

# =============================================================================
# 🎨 视觉与布局配置
# =============================================================================

layout:
  max_width: 1200px               # 主内容区最大宽度（适当减小提升阅读舒适度）

# 角标配置（右上角 GitHub Fork 角标）
triangle_badge:
  enable: true                    # ✅ 启用角标
  icon: github                    # 角标图标（同 social 配置）
  link: "https://github.com/mingchuanxie540"  # 点击跳转链接

# 锚点图标（文章内标题旁显示的链接图标）
anchor_icon: ""                   # 留空使用默认 '#'，或填 Font Awesome 代码如 'f0c1'，false=隐藏

# 🎮 灵梦主题特色：自定义鼠标指针
reimu_cursor:
  enable: true                    # ✅ 启用灵梦风格鼠标指针
  cursor:
    default: "../images/cursor/reimu-cursor-default.png"   # 默认指针
    pointer: "../images/cursor/reimu-cursor-pointer.png"   # 可点击元素指针
    text: "../images/cursor/reimu-cursor-text.png"         # 文本选择指针

# 图标字体配置（主题内置）
icon_font: "4552607_ex15nbittbh"  # 保持默认，勿修改（主题依赖）

# =============================================================================
# 🔤 字体配置（中文优化 + 代码字体）
# =============================================================================

# Google Fonts（网络加载，优先级高）
font:
  enable: true                    # ✅ 启用 Google Fonts
  article:
    - "Noto Serif SC"             # 中文衬线体（优雅易读，推荐）
    - "Mulish"                    # 英文无衬线体（现代简洁）
  code:
    - "JetBrains Mono"            # 代码字体（等宽 + 连字，程序员最爱）

# 本地回退字体（无网络时显示，保证可读性）
local_font:
  article:
    - "-apple-system"             # macOS/iOS 系统字体
    - "PingFang SC"               # 苹方（macOS 中文）
    - "Microsoft YaHei"           # 微软雅黑（Windows 中文）
    - "sans-serif"                # 通用无衬线字体
  code:
    - "Menlo"                    # macOS 代码字体
    - "Monaco"
    - "Consolas"                 # Windows 代码字体
    - "monospace"                # 通用等宽字体

# 🌓 暗黑模式配置
dark_mode:
  enable: auto                    # true=默认暗黑 / false=默认亮色 / auto=跟随系统（推荐）

# =============================================================================
# ⚡ 性能优化（关键！关闭重型功能）
# =============================================================================

# 🔥 关闭不必要的实验性功能（提升加载速度 + 稳定性）
pjax:
  enable: false                   # ❌ 关闭：可能兼容性问题，新手不建议开

service_worker:
  enable: false                   # ❌ 关闭：除非需要 PWA 离线功能

live2d:
  enable: false                   # ❌ 关闭：看板娘会拖慢加载（按需开启）

live2d_widgets:
  enable: false

quicklink:
  enable: false                   # ❌ 关闭：预加载可能增加服务器压力

# ✅ 开启实用性能优化
preloader:
  enable: true                    # ✅ 启用加载动画
  text:
    zh-CN: "少女祈祷中..."
    zh-TW: "少女祈禱中..."
    en: "Loading..."
  icon: ""                        # 留空使用默认内联 SVG（更快）
  rotate: true                    # ✅ 图标旋转动画

# 🎬 动画配置（适度开启，保持流畅）
animation:
  enable: true                    # ✅ 启用页面滚动动画
  options:
    header: { title: "slide-up", subTitle: "slide-down" }
    home: { post: "fade-up", widget: "fade-up", sidebar: "fade-up" }
    article: { whole: "fade-up", date: "zoom-in", category: "zoom-in", tag: "zoom-in", comment: "zoom-in", reading: "zoom-in", nav: "fade-up" }
    archive: { whole: "fade-up", tag: "zoom-in", category: "zoom-in", section: "fade-up", nav: "fade-up" }

# 🎆 烟花特效（手机端自动关闭，提升性能）
firework:
  enable: true                    # ✅ 启用鼠标点击烟花特效
  disable_on_mobile: true         # ✅ 关键：手机端禁用（节省流量 + 提升性能）
  options:
    excludeElements: ["a", "button"]  # 排除元素（避免干扰点击）
    particles:
      - shape: "circle"
        move: ["emit"]
        easing: "easeOutExpo"
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)"]
        number: 15                # ← 适当减少粒子数（性能优化）
        duration: [1200, 1800]
        shapeOptions: { radius: [16, 32], alpha: [0.3, 0.5] }
      - shape: "circle"
        move: ["diffuse"]
        easing: "easeOutExpo"
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions: { radius: 20, alpha: [0.2, 0.5], lineWidth: 6 }

# =============================================================================
# 💬 评论系统配置（推荐 Giscus，基于 GitHub）
# =============================================================================

comment:
  title:
    en: "Leave a comment"
    zh-CN: "说些什么吧！"
    zh-TW: "說些什麼吧！"
  default: "giscus"               # ✅ 默认评论系统：giscus（免后端，基于 GitHub）

# ✅ Giscus 配置（在 https://giscus.app/zh-CN 生成）
giscus:
  enable: false
  repo: "mingchuanxie540/mingchuanxie540.github.io"  # ← 你的 GitHub 仓库
  repoId: ""                      # ← 在 giscus.app 生成（重要！）
  category: "General"             # Discussions 分类名（需提前在仓库创建）
  categoryId: ""                  # ← 在 giscus.app 生成（重要！）
  mapping: "pathname"             # 评论标识：pathname（推荐）/ url / title
  strict: 0                       # 严格匹配：0=宽松 / 1=严格
  reactionsEnabled: 1             # ✅ 显示表情反应按钮（👍😄🎉等）
  emitMetadata: 0                 # 不发送元数据（隐私保护）
  inputPosition: "bottom"         # 输入框位置：bottom（底部）/ top（顶部）
  theme:
    light: "light"                # 亮色主题
    dark: "dark"                  # 暗色主题

# ❌ 其他评论系统保持关闭（除非你确定要用）
waline:
  enable: false
  serverURL: ""
  emoji:
    - "https://unpkg.com/@waline/emojis@1.2.0/weibo"
    - "https://unpkg.com/@waline/emojis@1.2.0/alus"
  meta: ["nick", "mail", "link"]
  requiredMeta: ["nick", "mail"]
  pageSize: 10
  pageview: true

valine:
  enable: false
  appId: ""
  appKey: ""
  pageSize: 10
  avatar: "mp"
  placeholder: "Just go go"
  guest_info: "nick,mail,link"
  recordIP: true
  highlight: true
  visitor: false

twikoo:
  enable: false
  envId: ""
  region: ""

gitalk:
  enable: false
  clientID: ""
  clientSecret: ""
  repo: ""
  owner: ""
  admin: ""

utterances:
  enable: false
  repo: ""
  issue_term: "title"
  theme: "auto"

beaudar:
  enable: false
  repo: ""
  branch: "main"
  issue_term: "title"
  theme: "auto"

disqus:
  enable: false
  shortname: ""
  count: true

# =============================================================================
# 🔍 搜索功能配置（本地搜索 + Algolia 预留）
# =============================================================================

# ✅ 本地搜索（零配置，完全免费，推荐先用这个）
# 只需在 hugo.toml 确保输出 JSON：[outputs] home = ['HTML', 'RSS', 'JSON']

# ⚠️ Algolia 搜索（需要配置 + 上传索引，先保持关闭）
algolia_search:
  enable: false                   # ← 先用本地搜索，需要时再改 true
  appID: "Q7EXNAF0XS"             # ← 你的 AppID（已填）
  apiKey: "2060a7952a65d36387b78ff140cb5d80"  # ⚠️ 确认是 Search-Only Key！
  indexName: "mingchuanxie540_blog"  # ← 必填：自定义索引名
  hits:
    per_page: 10                  # 每页显示 10 条搜索结果

# =============================================================================
# 📝 文章版权与保护配置
# =============================================================================

# 文章末尾版权声明
article_copyright:
  enable: true                    # ✅ 开启：保护原创内容
  content:
    author: true                  # 显示作者
    link: true                    # 显示原文链接
    title: true                   # 显示文章标题
    date: true                    # 显示发布时间
    updated: true                 # 显示更新时间
    license: true                 # 显示许可协议
    license_type: "by-nc-sa"      # CC 协议：署名 - 非商业 - 相同方式共享

# 🔝 返回顶部按钮
top:
  enable: true                    # ✅ 启用返回顶部按钮
  position: right                 # 按钮位置：left / right
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true

# ⏰ 文章过时提醒（技术博客推荐开启）
outdate:
  enable: true                    # ✅ 开启：提醒读者内容可能过时
  daysAgo: 180                    # 180 天前更新的文章显示提醒
  message:
    zh-CN: "本文最后更新于 {time}，请注意文中内容可能已不适用。"
    zh-TW: "本文最後更新於 {time}，請注意文中內容可能已不適用。"
    en: "This article was last updated on {time}. Content may be outdated."

# =============================================================================
# 🇨🇳 ICP 备案配置（国内服务器必填）
# =============================================================================

icp:
  icpnumber: ""                   # ← ICP 备案号（如 "粤ICP备12345678号"），没有留空
  beian: ""                       # 网安备案号
  recordcode: ""                  # 网安备案链接中的 recordcode 参数

moe_icp:
  icpnumber: ""                   # 萌国 ICP 备案号（可选）

# =============================================================================
# ☕ 打赏与分享配置（按需启用）
# =============================================================================

sponsor:
  enable: false                   # ❌ 关闭：需要时改为 true
  tip:
    zh-CN: "请作者喝杯咖啡吧"
    zh-TW: "請作者喝杯咖啡吧"
    en: "Buy me a coffee"
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true
  qr:
    # - name: "支付宝"
    #   src: "sponsor/alipay.jpg"
    # - name: "微信"
    #   src: "sponsor/wechat.png"

# 🔗 分享按钮（按需启用）
share:
  # - weibo
  # - weixin
  # - qq
  # - twitter

# =============================================================================
# 🏷️ 首页分类卡片配置（按需开启）
# =============================================================================

home_categories:
  enable: false                   # ❌ 关闭：首页不显示分类卡片（保持简洁）
  content: []

# =============================================================================
# 🔧 高级注入配置（自定义代码/统计/第三方脚本）
# =============================================================================

injector:
  head_begin: ""                  # <head> 开始处注入（极少用）
  head_end: |                     # </head> 前注入（推荐：加载自定义 CSS/统计代码）
    <link rel="stylesheet" href="/css/custom.css">
    <!-- 百度统计代码可放这里（如有） -->
    <!--
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?你的ID";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
    -->
  body_begin: ""                  # <body> 开始处注入（极少用）
  body_end: ""                    # </body> 前注入（可放统计/交互脚本）
  sidebar_begin: ""               # <aside> 开始处注入
  sidebar_end: ""                 # </aside> 前注入

# =============================================================================
# 🧪 实验性功能（全部关闭，保证稳定）
# =============================================================================

material_theme:
  enable: false                   # ❌ 动态配色（可能 CORS 问题，按需开启）

pangu:
  enable: false                   # ❌ 中英文加空格（按需开启）

pace:
  enable: false                   # ❌ 加载进度条（按需开启）

player:
  disable_on_mobile: true         # ✅ 手机端禁用播放器
  position: "after_widget"        # 播放器位置：before_sidebar / after_sidebar / after_widget
  aplayer:
    enable: false                 # ❌ APlayer 音乐播放器（按需开启）
    options:
      audio: []                   # 播放列表（格式见主题文档）
      fixed: true
      autoplay: false
      loop: "all"
      order: "list"
      preload: "metadata"
      volume: 0.7
      mutex: true
      listFolded: true
      lrcType: 0
  meting:
    enable: false                 # ❌ Meting（网易云/QQ音乐快捷接入）
    meting_api: ""
    options:
      id: 2265921590
      server: "netease"
      type: "playlist"
      auto: ""

# =============================================================================
# 🎨 主题颜色配置（灵梦红 + 自定义）
# =============================================================================

internal_theme:
  light:
    # 主色调（灵梦红，可自定义）
    --red-0: "#ff0000"
    --red-1: "#ff6b9d"            # ← 主色调，可改你喜欢的颜色
    --red-2: "#ff8fb3"
    --red-3: "#ffafaf"
    --red-4: "#ffd0d0"
    --red-5: "#ffecec"
    --red-5-5: "#fff3f3"
    --red-6: "#fff7f7"
    --color-red-6-shadow: "rgba(255, 78, 78, 0.6)"
    --color-red-3-shadow: "rgba(255, 78, 78, 0.3)"

    # 代码高亮配色（Monokai 主题）
    --highlight-nav: "#f5f5f5"
    --highlight-scrollbar: "#d6d6d6"
    --highlight-background: "#fdfdfd"
