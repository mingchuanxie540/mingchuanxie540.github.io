########################################
# 🎵 音乐播放器（已配置，按需启用）
########################################

player:
  disable_on_mobile: true       # ✅ 手机端禁用，节省流量
  position: after_widget        # 位置：固定在侧边栏下方
  
  # APlayer 配置
  aplayer:
    enable: false               # ← 需要时改为 true
    options:
      fixed: true               # 固定播放器（吸底）
      autoplay: false           # 不自动播放
      loop: all                 # 循环模式
      order: list               # 播放顺序
      preload: metadata         # 预加载策略
      volume: 0.7               # 默认音量
      mutex: true               # 互斥：同时只播放一个
      listFolded: true          # 播放列表默认折叠
      lrcType: 0                # 歌词类型
      
      # 播放列表（示例，替换成你的）
      audio:
        # - name: "clear vision"
        #   artist: "EastNewSound"
        #   url: "https://example.com/music/clear_vision.mp3"
        #   cover: "https://example.com/covers/clear_vision.jpg"
        #   lrc: "https://example.com/lrc/clear_vision.lrc"

  # Meting（网易云/QQ音乐快捷接入）
  meting:
    enable: false
    meting_api: ""
    options:
      id: 2265921590            # 歌单ID
      server: netease           # 平台：netease / tencent / kugou
      type: playlist            # 类型：playlist / album / search
      auto: ""

########################################
# 🧪 实验性功能（全部关闭，保证稳定）
########################################

material_theme: { enable: false }   # 动态配色，可能 CORS 问题
pangu: { enable: false }            # 中英文加空格，按需开启
pace: { enable: false }             # 加载进度条，按需开启

# 播放器高级功能（按需）
player_advanced:
  enable: false
  dplayer:
    enable: false
    danmaku: false
