# 🧪 实验功能/播放器/主题颜色（🔒 勿动，💡 可改主色调）
[material_theme]
enable = false
[pangu]
enable = false
[pace]
enable = false
[params.player]
disable_on_mobile = true
position = 'after_widget'
[params.player.aplayer]
enable = false
[params.player.aplayer.options]
audio = []
fixed = true
autoplay = false
loop = 'all'
order = 'list'
preload = 'metadata'
volume = 0.7
mutex = true
listFolded = true
lrcType = 0
[params.player.meting]
enable = false
meting_api = ''
[params.player.meting.options]
id = 2265921590
server = 'netease'
type = 'playlist'
auto = ''
