# 🛠️ 管道与安全（🔒 勿动，CSP修改需同步更新外部域名白名单）
[params.pipeline]
disable = false
[params.pipeline.css]
bundle = true
minify = true
[params.pipeline.js]
bundle = true
minify = true
[params.performance]
dnsPrefetch = ['https://cdn.jsdelivr.net', 'https://fonts.googleapis.com', 'https://fonts.gstatic.com']
preconnect = ['https://cdn.jsdelivr.net']
prefetch = true
[params.security]
csp = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;"
referrer = 'strict-origin-when-cross-origin'
externalLinks = { nofollow = true, noreferrer = true }

# ⚙️ 构建与内容组织（🔒 勿动）
[build]
writeStats = false
cachebusters = [{ source = '^assets/watching/.*', target = 'css' }]
[imaging]
quality = 85
resampleFilter = 'Lanczos'
hint = 'photo'
anchor = 'smart'
[taxonomies]
category = 'categories'
tag = 'tags'
series = 'series'
[frontmatter]
date = ['date', 'publishDate', 'lastmod']
expiryDate = ['expiryDate']
lastmod = ['lastmod', 'date', 'publishDate']
publishDate = ['publishDate', 'date']

