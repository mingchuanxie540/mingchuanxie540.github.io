# ==============================================================================
# 🏷️ 注释标签说明
# 🔴 [必填] 必须手动替换为你的真实数据/链接
# 🟡 [资源] 需在 static/ 对应目录放置文件，否则显示空白/404
# 🔵 [API] 需前往第三方平台申请密钥/ID，填入后功能才生效
# 💡 [可改] 按需调整的个性化参数（不改也可正常运行）
# 🔒 [勿动] 主题/构建核心依赖，修改会导致报错或样式丢失
# 📖 [逻辑] 配置作用说明，帮助理解运行机制
# ==============================================================================

# 🔧 基础配置（🔴 必填项，影响全局链接与SEO）
baseURL = 'https://mingchuanxie540.github.io/'  # 🔴 [必填] 你的实际访问域名，末尾必须带 /
languageCode = 'zh-CN'                           # 🔒 [勿动] 站点主语言代码（影响日期/标点渲染）
title = '明传协的博客'                             # 🔴 [必填] 浏览器标签页 & 搜索引擎标题
theme = ['hugo-theme-reimu']                     # 🔒 [勿动] 主题目录名，必须与 themes/ 下文件夹一致
defaultContentLanguage = 'zh-CN'                 # 🔒 [勿动] 默认加载语言
defaultContentLanguageInSubdir = false           # 📖 [逻辑] false=URL不拼接 /zh-cn，路径更干净

# 🌐 多语言配置（按需保留/删除，🔴 按需改标题/描述）
[languages.zh-CN]                                # 📖 [逻辑] 简体中文（主语言）
languageName = '简体中文'                      # 🔒 [勿动] 语言切换器显示文字
languageCode = 'zh-CN'                         # 🔒 [勿动] ISO语言代码
weight = 1                                     # 🔒 [勿动] 权重：越小优先级越高
hasCJKLanguage = true                          # 🔒 [勿动] 优化中文换行/字数统计
title = '明传协的博客'                          # 🔴 [必填] 该语言下的独立标题
[languages.zh-CN.params]
description = '记录技术成长与生活点滴'          # 🔴 [必填] SEO摘要（控制在80字内）
keywords = ['博客', '技术', '全栈开发', 'Hugo'] # 🔴 [必填] 搜索引擎关键词

[languages.en]                                 # 💡 [可改] 不需要可整块删除
languageName = 'English'
weight = 2
title = "Mingchuanxie's Blog"
[languages.en.params]
description = 'Personal tech blog | Hugo + GitHub Pages'
keywords = ['blog', 'tech', 'frontend', 'hugo']



# 🧭 顶部导航菜单（🔴 必填/按需改链接，📖 [逻辑] 按weight从小到大从左到右排列）
[[menu.main]]
identifier = 'home'                            # 🔒 [勿动] 唯一标识，CSS/JS依赖此ID
name = '首页'                                   # 🔴 [必填] 显示文字
url = '/'                                      # 🔴 [必填] 跳转路径
weight = 1                                     # 🔒 [勿动] 排序权重
[[menu.main]]
identifier = 'archives'
name = '归档'
url = '/archives/'                             # 🔒 [勿动] 末尾 / 不可省略，否则路由匹配失败
weight = 2
[[menu.main]]
identifier = 'categories'
name = '分类'
url = '/categories/'
weight = 3
[[menu.main]]
identifier = 'tags'
name = '标签'
url = '/tags/'
weight = 4
[[menu.main]]
identifier = 'about'
name = '关于'
url = '/about/'
weight = 5
[[menu.main]]
identifier = 'resume'
name = '简历'
url = '/resume/'
weight = 6

# 📝 Markdown 渲染配置（🔒 勿动核心参数，💡 可改代码高亮主题）
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true                              # 🔒 [勿动] 允许文章内嵌 HTML/iframe
hardWraps = false                          # 📖 [逻辑] 不将回车强制转 <br>
xHTML = false                              # 🔒 [勿动] 输出标准 HTML5
[markup.goldmark.extensions.passthrough]
enable = true                              # 🔒 [勿动] 启用数学公式渲染
delimiters = { block = [['\\[', '\\]'], ['$$', '$$']], inline = [['\\(', '\\)'], ['$', '$']] }
[markup.goldmark.extensions.cjk]
enable = true                              # 🔒 [勿动] 自动优化中文标点间距
[markup.goldmark.extensions.typographer]
enable = true                              # 🔒 [勿动] 自动美化引号/破折号/省略号
[markup.highlight]
codeFences = true                            # 🔒 [勿动] 启用 ``` 代码块
guessSyntax = true                           # 💡 [可改] 自动识别语言（未写语言名时）
lineNos = true                               # 💡 [可改] 显示行号
lineNumbersInTable = true                    # 🔒 [勿动] 行号与代码分列（复制不带行号）
noClasses = false                            # 🔒 [勿动] 使用CSS类（便于主题换肤）
style = 'monokai'                            # 💡 [可改] 代码高亮主题（Dracula/OneDark等）
tabWidth = 2                                 # 💡 [可改] Tab转2空格
anchorLineNos = false                        # 🔒 [勿动] 行号不可点击跳转
hl_Lines = ''                                # 💡 [可改] 预留：高亮指定行（如 "2-5,10"）
hl_inline = false                            # 🔒 [勿动] 高亮样式不内联

# 📡 输出格式（🔒 勿动，否则搜索/订阅失效）
[outputs]
home = ['HTML', 'RSS', 'JSON']                 # 🔒 [勿动] JSON必须保留！本地搜索依赖此文件
section = ['HTML', 'RSS']
taxonomy = ['HTML', 'RSS']
term = ['HTML', 'RSS']
[outputFormats.Algolia]
mediaType = 'application/json'
baseName = 'algolia'                           # 📖 [逻辑] 生成 algolia.json 供云端搜索索引
isPlainText = true
notAlternative = true
[outputFormats.RSS]
mediaType = 'application/rss+xml'
baseName = 'feed'                              # 📖 [逻辑] 生成 feed.xml（兼容性更好）
rel = 'alternate'

# 🔍 全站参数 [params]（逐行强标注，合并原 params.yml 所有字段）
[params]
author = '明传协'                               # 🔴 [必填] 作者名（页脚/文章末尾/SEO）
email = 'mingchuanxie540@gmail.com'             # 🔴 [必填] 联系邮箱（社交链接/关于页）
description = '记录技术成长与生活点滴'          # 🔴 [必填] 全局SEO描述
keywords = ['博客', '技术', '前端', '随笔']     # 🔴 [必填] 全局SEO关键词

# ✨ 副标题打字机（💡 可改句子/速度，🔒 勿动逻辑参数）
[params.subtitle]
text = '明传协的博客'                          # 📖 [逻辑] 打字机关闭时的静态备选文字
[params.subtitle.typing]
enable = true                                # 💡 [可改] true=开启动画 / false=显示上方 text
strings = ['博丽神社的巫女', '全栈开发工程师', '热爱技术与生活', '少女祈祷中...']  # 🔴 [必填] 轮播句子
typeSpeed = 100                              # 💡 [可改] 打字速度(ms)，越小越快
backSpeed = 50                               # 💡 [可改] 删除速度(ms)
backDelay = 2000                             # 💡 [可改] 句间停顿(ms)
startDelay = 300                             # 💡 [可改] 页面加载后延迟启动(ms)
loop = true                                  # 🔒 [勿动] 循环播放
shuffle = false                              # 🔒 [勿动] 顺序播放
showCursor = true                            # 🔒 [勿动] 显示闪烁光标
cursorChar = '|'                             # 💡 [可改] 光标字符（可换 "_" 或 "✦"）
smartBackspace = true                        # 🔒 [勿动] 智能退格（只删不同部分）

# 🖼️ 横幅与头像（🟡 资源路径严格对应 static/ 目录结构）
banner = ''                                    # 🟡 [资源] 填 'images/banner.webp' 或留空用默认渐变
banner_srcset = []                             # 🟡 [资源] 响应式图配置（见下方示例，按需启用）
avatar = 'avatar.webp'                         # 🟡 [资源] 文件必须放 static/avatar/avatar.webp
cover = ''                                     # 📖 [逻辑] 文章封面策略：空=继承banner / false=不显示 / "链接"=指定

# 📖 阅读控制与SEO（🔒 勿动，💡 可改文字）
toc = true                                     # 🔒 [勿动] 文章自动生成目录
excerpt_link = '阅读全文'                      # 💡 [可改] 首页摘要“更多”按钮文字
[params.open_graph]
enable = true                                # 🔒 [勿动] 启用 og:* meta 标签（微信/微博分享预览）
options = { twitterCard = 'summary_large_image' }  # 💡 [可改] 推特卡片类型
[params.structured_data]
enable = true
type = 'Blog'                                # 🔒 [勿动] 站点类型（SEO结构化数据）
[params.verification]                          # 🔵 [API] 搜索引擎站长平台验证码（无则留空）
google = ''                                  # 🔵 [API] Google Search Console
baidu = ''                                   # 🔵 [API] 百度站长平台
bing = ''                                    # 🔵 [API] Bing Webmaster
sogou = ''                                   # 🔵 [API] 搜狗站长

# 🦶 页脚（🔴 改年份，🔒 勿动逻辑，🟡 图标按需放资源）
[params.footer]
since = 2026                                 # 🔴 [必填] 建站年份（自动算 © 2026-今年）
powered = true                               # 💡 [可改] 显示 "Powered by Hugo"
count = true                                 # 🔒 [勿动] 显示访问统计
busuanzi = true                              # 🔒 [勿动] 启用不蒜子统计（轻量无后端）
[params.footer.icon]
url = ''                                     # 🟡 [资源] 页脚图标路径（如 "../images/taichi.png"）
rotate = false                               # 💡 [可改] 悬停旋转动画
mask = false                                 # 💡 [可改] 鼠标悬停遮罩
custom = 'Theme: hugo-theme-reimu'           # 💡 [可改] 自定义页脚底部文字

# 📍 侧边栏（🔒 勿动核心，💡 可改宽度/位置）
[params.sidebar]
position = 'left'                           # 🔒 [勿动] 侧边栏位置：left / right
sticky = true                                # 🔒 [勿动] 滚动时固定侧边栏
width = '320px'                              # 💡 [可改] 侧边栏宽度
[params.sidebar.article]
show_common = true                           # 🔒 [勿动] 文章页显示分类/标签等常用组件

# 🔗 社交链接（🔴 必填/按需取消注释，📖 逻辑：填完整URL即可自动渲染图标）
[params.social]
email = 'mailto:mingchuanxie540@gmail.com'   # 🔴 [必填] 邮箱（必须带 mailto: 协议）
github = 'https://github.com/mingchuanxie540' # 🔴 [必填] GitHub主页
# bilibili = 'https://space.bilibili.com/你的UID'  # 🟡 [资源] 取消注释并填链接
# weibo = 'https://weibo.com/u/你的ID'
# zhihu = 'https://www.zhihu.com/people/你的用户名'
# twitter = 'https://twitter.com/yourname'
# linkedin = 'https://www.linkedin.com/in/yourname'

# 🧩 侧边栏小工具（🔒 勿动数组名，💡 可改数量限制）
widgets = ['category', 'tag', 'tagcloud', 'recent_posts']
category_limits = 10                         # 💡 [可改] 分类最多显示数
tag_limits = 10                              # 💡 [可改] 标签最多显示数
recent_posts_limits = 5                      # 💡 [可改] 最新文章最多显示数
tagcloud_limits = 20                         # 💡 [可改] 标签云最多显示数
only_show_capsule_in_index = true            # 🔒 [勿动] 首页标签折叠显示（提速）
uppercase_capsule = true                     # 💡 [可改] 胶囊文字大写
show_update_time = true                      # 🔒 [勿动] 显示“最后更新于”

# 📝 摘要与RSS（🔒 勿动）
[params.summary]
enable = true
style = 'subtitle'                           # 💡 [可改] 摘要样式：'subtitle' / 'blockquote'
[params.rss]
limit = 20                                   # 💡 [可改] RSS输出篇数（-1=全部）
showFullContent = true                       # 🔒 [勿动] RSS输出全文
showCopyright = true                         # 🔒 [勿动] RSS带版权声明

# 🔄 排序与分页（🔒 勿动）
[params.sort_order]
[params.sort_order.taxonomy]
category = 'date-reverse'
tag = 'date-reverse'
[params.sort_order.archive]
archive = 'date-reverse'
[params.sort_order.home]
home = 'date-reverse'
[params.paginate]
archive = 12                                 # 💡 [可改] 归档/分类/标签每页篇数
post = 10                                    # 💡 [可改] 首页每页篇数

# 🎨 视觉与布局（💡 可改宽度/角标链接）
[params.layout]
max_width = '1200px'                         # 💡 [可改] 主内容区最大宽度
[params.triangle_badge]
enable = true
icon = 'github'
link = 'https://github.com/mingchuanxie540'  # 🔴 [必填] 右上角Fork角标跳转仓库
anchor_icon = ''                             # 💡 [可改] 标题锚点图标（留空用默认# / false=隐藏）
[params.reimu_cursor]
enable = false                               # 🟡 [资源] 开启需准备3张32x32 PNG放 static/images/cursor/
[params.reimu_cursor.cursor]
default = '../images/cursor/reimu-cursor-default.png'
pointer = '../images/cursor/reimu-cursor-pointer.png'
text = '../images/cursor/reimu-cursor-text.png'
icon_font = '4552607_ex15nbittbh'            # 🔒 [勿动] 主题内置字体ID，修改会丢图标

# 🔤 字体（🔒 勿动回退字体，💡 可改网络字体）
[params.font]
enable = true
[params.font.article]
fonts = ['Noto Serif SC', 'Mulish']          # 💡 [可改] 正文：中文衬线 + 英文无衬线
[params.font.code]
fonts = ['JetBrains Mono']                   # 💡 [可改] 代码等宽字体
[params.local_font]
[params.local_font.article]
fonts = ['-apple-system', 'PingFang SC', 'Microsoft YaHei', 'sans-serif']
[params.local_font.code]
fonts = ['Menlo', 'Monaco', 'Consolas', 'monospace']
[dark_mode]
enable = 'auto'                              # 💡 [可改] true=暗色 / false=亮色 / auto=跟随系统

# ⚡ 性能优化（🔒 勿动开关逻辑，🟡 加载图标按需放资源）
[pjax]
enable = false                               # 🔒 [勿动] 新手防兼容问题
[service_worker]
enable = false                               # 🔒 [勿动] 无需PWA离线功能
[live2d]
enable = false
[live2d_widgets]
enable = false
[quicklink]
enable = false
[preloader]
enable = true
[preloader.text]
zh-CN = '少女祈祷中...'
zh-TW = '少女祈禱中...'
en = 'Loading...'
icon = ''                                    # 🟡 [资源] 自定义SVG路径（留空用内置）
rotate = true
[animation]
enable = true
[animation.options]
header = { title = 'slide-up', subTitle = 'slide-down' }
home = { post = 'fade-up', widget = 'fade-up', sidebar = 'fade-up' }
article = { whole = 'fade-up', date = 'zoom-in', category = 'zoom-in', tag = 'zoom-in', comment = 'zoom-in', reading = 'zoom-in', nav = 'fade-up' }
archive = { whole = 'fade-up', tag = 'zoom-in', category = 'zoom-in', section = 'fade-up', nav = 'fade-up' }
[firework]
enable = true
disable_on_mobile = true                     # 🔒 [勿动] 手机端禁用（保性能）
[firework.options]
excludeElements = ['a', 'button']
[[firework.options.particles]]
shape = 'circle'
move = ['emit']
easing = 'easeOutExpo'
colors = ['var(--red-1)', 'var(--red-2)', 'var(--red-3)']
number = 15                                  # 💡 [可改] 单簇粒子数（调小更流畅）
duration = [1200, 1800]
shapeOptions = { radius = [16, 32], alpha = [0.3, 0.5] }
[[firework.options.particles]]
shape = 'circle'
move = ['diffuse']
easing = 'easeOutExpo'
colors = ['var(--red-0)']
number = 1
duration = [1200, 1800]
shapeOptions = { radius = 20, alpha = [0.2, 0.5], lineWidth = 6 }

# 💬 评论系统（🔵 API必须申请，📖 逻辑：填完repoId/categoryId再改enable=true）
[params.comment]
